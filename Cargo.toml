[package]
name = "hello-world"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
clap = "4.5.53"
color-eyre = "0.6.5"
config = { version = "0.15.19", features = ["corn"] }
cucumber = { version = "0.21.1", features = ["timestamps", "tracing", "output-json"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
http = "1.4.0"
human-panic = "2.0.4"
minijinja = "2.12.0"
notify = "8.2.0"
opentelemetry = "0.31.0"
rootcause = "0.10.0"
rovo = { features = ["redoc", "swagger", "scalar"], git = "https://github.com/Arthurdw/rovo" }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tower-http = { version = "0.6.7", features = ["set-header"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "time"] }
wasmtime = "39.0.1"

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.145"

[[test]]
# The name of the test binary (matches the file name without extension)
name = "api_steps"
# The path to the file
path = "tests/api_steps.rs"
# Set to false to avoid running it through the standard test harness
harness = false
